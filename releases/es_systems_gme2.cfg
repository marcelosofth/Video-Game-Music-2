<?xml version="1.0"?>
<systemList>
  <system>
        <fullname>Video Game Music 2</fullname>
        <name>gme2</name>
        <manufacturer>Various</manufacturer>
        <release>1980</release>
        <hardware>Soundtracks</hardware>
        <path>/userdata/roms/gme2</path>
        <extension>.zip .nsf .nsfe .spc .gbs .gym .hes .kss .ay .sap .vgm .vgz .mid .mod .s3m .xm .it .mp3</extension>
        <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>gme2</platform>
        <theme>gme2</theme>
        <emulators>
            <emulator name="libretro">
                <cores>
                    <core>gme2</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
